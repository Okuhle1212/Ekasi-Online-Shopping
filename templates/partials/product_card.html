<article class="product-card">
  <h2>{{ product.name }}</h2>
  <img
    src="{{ url_for('static', filename='images/' ~ product.image) }}"
    alt="{{ product.name }}"
    loading="lazy"
    onerror="this.onerror=null; this.src='/static/images/placeholder.svg';"
  >
  <p class="price">R{{ '%.2f'|format(product.price) }}</p>
  <p class="description">{{ product.description }}</p>
  {% if session.get("user_id") and session.get("role") != "owner" %}
    <form action="{{ url_for('add_to_cart', product_id=product.id) }}" method="POST" class="add-to-cart-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="qty-{{ product.id }}">Qty:</label>
      <input type="number" id="qty-{{ product.id }}" name="quantity" value="1" min="1" max="20" class="qty-input">
      <button type="submit">Add to Cart</button>
    </form>
  {% elif not session.get("user_id") %}
    <p class="login-hint"><a href="{{ url_for('login') }}">Log in</a> to add this to your cart.</p>
  {% endif %}
</article>
