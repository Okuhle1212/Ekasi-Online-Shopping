{% extends "base.html" %}

{% block title %}Ekasi Online Shopping{% endblock %}

{% block content %}
  <section class="search-bar">
    <form action="{{ url_for('home') }}" method="GET" class="search-form">
      <input type="text" name="q" value="{{ search }}" placeholder="Search products...">
      <button type="submit">Search</button>
      {% if search %}
        <a href="{{ url_for('home') }}" class="clear-search">Clear</a>
      {% endif %}
    </form>
  </section>

  <section class="product-list">
    {% if products %}
      {% for product in products %}
        {% include "partials/product_card.html" %}
      {% endfor %}
    {% else %}
      <p class="empty-message">No products found.</p>
    {% endif %}
  </section>
{% endblock %}
