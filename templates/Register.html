{% extends "base.html" %}

{% block title %}Register - Ekasi Online Shopping{% endblock %}
{% block header_title %}Register{% endblock %}

{% block content %}
  <section class="auth-form">
    <h2>Create Account</h2>
    <form action="{{ url_for('register') }}" method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" placeholder="Enter your name" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="Enter your email" required>

      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" pattern="[0-9]{10}" required>

      <label for="password">Password</label>
      <div class="password-container">
        <input type="password" id="password" name="password" placeholder="Create a password (min. 6 characters)" minlength="6" required>
        <button type="button" class="toggle-password" onclick="togglePassword('password')">Show</button>
      </div>

      <button type="submit" class="register-btn">Register</button>
    </form>
    <p>Already have an account? <a href="{{ url_for('login') }}">Login here</a></p>
  </section>

  <script>
    function togglePassword(fieldId) {
      const field = document.getElementById(fieldId);
      const button = field.parentElement.querySelector('.toggle-password');
      if (field.type === 'password') {
        field.type = 'text';
        button.textContent = 'Hide';
      } else {
        field.type = 'password';
        button.textContent = 'Show';
      }
    }
  </script>
{% endblock %}
