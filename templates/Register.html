<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register - Ekasi Online Shopping</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='Login & Register.css') }}">
</head>
<body>

  <header class="menu-header">
    <h1>Register</h1>
    <nav>
    <ul>
      <li><a href="{{ url_for('home') }}">Home</a></li>
      <li><a href="{{ url_for('kota') }}">Kota</a></li>
      <li><a href="{{ url_for('chips') }}">Chips</a></li>
      <li><a href="{{ url_for('orders') }}">Orders</a></li>
      <li><a href="{{ url_for('cart') }}">Cart</a></li>

      <li class="auth-group">
        {% if session.get("user_id") %}
          <a href="{{ url_for('logout') }}" class="auth">Logout</a>
        {% else %}
          <a href="{{ url_for('login') }}" class="auth">Login</a>
          <a href="{{ url_for('register') }}" class="auth signup">Register</a>
        {% endif %}
      </li>
    </ul>
  </nav>

  </header>

  <section class="auth-form">
    <h2>Create Account</h2>
    <!-- Form posts to Flask /register route -->
    <form action="{{ url_for('register') }}" method="POST">
      <label>Full Name</label>
      <input type="text" name="name" placeholder="Enter your name" required>

      <label>Email</label>
      <input type="email" name="email" placeholder="Enter your email" required>

      <label>Phone Number</label>
      <input type="tel" name="phone" placeholder="Enter your phone number" pattern="[0-9]{10}" required>

      <label>Password</label>
      <input type="password" name="password" placeholder="Create a password" required>

      <button type="submit" class="register-btn">Register</button>
    </form>
    <p>Already have an account? <a href="{{ url_for('login') }}">Login here</a></p>
  </section>

  <footer>
    <p>&copy; 2026 Nkosana’s Kota Shop</p>
  </footer>

</body>
</html>
